{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="gate card">
  <h1>Register</h1>
  <p class="sub">Approval required before first login. The same employee ID works on the other Erudore apps.</p>
  <form method="post">
    <label for="employee_id">Employee ID</label>
    <input id="employee_id" name="employee_id" required>
    <label for="name">Full name</label>
    <input id="name" name="name" required>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required minlength="6">
    <button class="btn" type="submit">Submit registration</button>
  </form>
  <p class="foot"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</section>
{% endblock %}
