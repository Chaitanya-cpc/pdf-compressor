{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="gate card">
  <h1>Sign in</h1>
  <form method="post">
    <label for="employee_id">Employee ID</label>
    <input id="employee_id" name="employee_id" type="text" required autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="foot">No account? <a href="{{ url_for('register') }}">Register</a>
    · <a href="{{ url_for('forgot_password') }}">Forgot password</a></p>
</section>
{% endblock %}
