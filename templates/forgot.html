{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="gate card">
  <h1>Reset password</h1>
  <p class="sub">Current password works until this is approved.</p>
  <form method="post">
    <label for="employee_id">Employee ID</label>
    <input id="employee_id" name="employee_id" required autofocus>
    <label for="password">New password</label>
    <input id="password" type="password" name="password" required minlength="6">
    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" type="password" name="confirm_password" required minlength="6">
    <button class="btn" type="submit">Request password reset</button>
  </form>
  <p class="foot"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</section>
{% endblock %}
